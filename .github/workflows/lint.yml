name: Lint
on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the correct Node version using nvm
        shell: bash -l {0}
        run: nvm install
      - uses: bahmutov/npm-install@v1
        with:
          useLockFile: false
      - name: Lint
        run: npm run lint
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
      - name: Typecheck
        run: npm run tsc
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
