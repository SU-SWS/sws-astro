name: Lint
on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: bahmutov/npm-install@v1
        with:
          useLockFile: false
      - name: Lint
        run: npm run lint
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
      - name: Typecheck
        run: npm run check
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
